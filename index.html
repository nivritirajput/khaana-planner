<!DOCTYPE html>
<html lang="en" data-theme="masala">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khaana Planner</title>
<meta name="description" content="Khaana Planner by Nivriti Rajput: a month-by-month Indian vegetarian and vegan meal planner with seasonal North Indian food, school tiffins, treat days and full nutrient tracking. In English and Hindi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ---------- themes ---------- */
  :root, [data-theme="masala"] {
    --bg: #fff8ef; --card: #ffffff; --cell: #fffdf9; --chip: #ffffff;
    --ink: #3b2416; --muted: #8a6d5a; --line: #f1dfcc;
    --accent: #f28c28; --accent-d: #c9620a; --accent-2: #ffb347;
    --glow1: #ffe6c7; --glow2: #e6f7ea;
    --green: #2f9e5b; --green-l: #e5f6eb; --good-bg: #f1faf4;
    --amber: #d99a00; --amber-l: #fff4d6;
    --red: #d9534f; --red-l: #fde8e7;
    --treat: #e2456b; --treat-l: #ffe8ee; --treat-b: #ffc6d3;
    --tiffin: #3a7bd5; --tiffin-l: #e7f0fd; --tiffin-b: #c4d9f7;
    --vegan: #3c9d3c;
    --shadow: 0 8px 24px rgba(160, 90, 30, .12);
  }
  [data-theme="gulabi"] {
    --bg: #fff2f8; --cell: #fffafd; --ink: #4a1a37; --muted: #9a5f80; --line: #f8d6e7;
    --accent: #e8559b; --accent-d: #b8236a; --accent-2: #ff9ccb;
    --glow1: #ffd6ea; --glow2: #efe0ff;
    --shadow: 0 8px 24px rgba(200, 60, 130, .14);
  }
  [data-theme="pudina"] {
    --bg: #f1fbf5; --cell: #fbfffc; --ink: #173b2a; --muted: #5d8571; --line: #d4eedf;
    --accent: #1f9d6b; --accent-d: #12704b; --accent-2: #6fd3a5;
    --glow1: #d7f5e5; --glow2: #fff3d1;
    --shadow: 0 8px 24px rgba(20, 110, 70, .12);
  }
  [data-theme="raat"] {
    --bg: #17120f; --card: #241c17; --cell: #2b221c; --chip: #33291f;
    --ink: #f6e9dc; --muted: #c3a894; --line: #45372b;
    --accent: #ff9a3c; --accent-d: #ffb066; --accent-2: #ffcf8a;
    --glow1: #2a1d12; --glow2: #13241b;
    --green: #5cc98a; --green-l: #1d3627; --good-bg: #1d3025;
    --amber: #f0c040; --amber-l: #3a3018;
    --red: #ff7b76; --red-l: #3d2222;
    --treat: #ff7a9a; --treat-l: #3a1f2a; --treat-b: #6a3346;
    --tiffin: #7fb0ff; --tiffin-l: #1c2738; --tiffin-b: #34486a;
    --vegan: #6fd36f;
    --shadow: 0 8px 24px rgba(0, 0, 0, .4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', 'Baloo 2', system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 10% 0%, var(--glow1) 0, transparent 40%),
      radial-gradient(circle at 100% 30%, var(--glow2) 0, transparent 35%),
      var(--bg);
    min-height: 100vh;
    transition: background-color .3s, color .3s;
  }
  h1, h2, h3, .brand, button, select { font-family: 'Baloo 2', system-ui, sans-serif; }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 0 16px 48px; }
  .card { background: var(--card); border-radius: 22px; box-shadow: var(--shadow); }

  /* ---------- header ---------- */
  header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding: 22px 0 14px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 54px; height: 54px; border-radius: 16px; flex: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center; font-size: 30px;
    box-shadow: 0 6px 16px rgba(0,0,0,.15);
    animation: steam 3s ease-in-out infinite;
  }
  @keyframes steam { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg) translateY(-3px); } }
  .brand h1 { font-size: 2rem; line-height: 1; color: var(--accent-d); }
  .brand small { display: block; color: var(--muted); font-weight: 600; font-size: .9rem; margin-top: 4px; }

  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn {
    cursor: pointer; font-weight: 700; font-size: 1rem;
    padding: 7px 14px; border-radius: 12px;
    background: var(--card); color: var(--ink);
    box-shadow: 0 2px 0 var(--line);
    border: 2px solid var(--line);
    transition: transform .15s, background .15s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent-d); box-shadow: 0 3px 0 var(--accent-d); }
  [data-theme="raat"] .btn.primary { color: #1a120c; }
  .btn.sm { font-size: .85rem; padding: 3px 10px; border-radius: 10px; }
  select {
    font-size: 1rem; font-weight: 700; padding: 7px 10px; border-radius: 12px;
    border: 2px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer;
  }

  /* ---------- options ---------- */
  .options { padding: 14px 16px; margin-bottom: 14px; display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: flex-end; }
  .opt { display: flex; flex-direction: column; gap: 4px; }
  .opt > label, .opt > .lbl { font-size: .78rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .seg { display: inline-flex; background: var(--bg); border: 2px solid var(--line); border-radius: 14px; padding: 3px; gap: 3px; }
  .seg button { border: none; background: transparent; font-weight: 700; font-size: .98rem; padding: 5px 12px; border-radius: 10px; cursor: pointer; color: var(--ink); }
  .seg button.on { background: var(--accent); color: #fff; }
  .seg button.on.vg { background: var(--vegan); }
  [data-theme="raat"] .seg button.on { color: #1a120c; }
  .checks { display: flex; flex-wrap: wrap; gap: 6px; }
  .chk {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    background: var(--bg); border: 2px solid var(--line); border-radius: 999px;
    padding: 4px 12px; font-weight: 700; font-size: .9rem; user-select: none;
  }
  .chk input { accent-color: var(--green); width: 16px; height: 16px; }
  .chk.on { background: var(--green-l); border-color: var(--green); }

  /* ---------- season card ---------- */
  .season { padding: 16px; margin-bottom: 14px; display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; align-items: start; overflow: hidden; position: relative; }
  .season .big { font-size: 3.2rem; line-height: 1; animation: float 4s ease-in-out infinite; grid-row: span 2; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .season h2 { font-size: 1.35rem; color: var(--accent-d); line-height: 1.2; }
  .season .wx { font-weight: 700; color: var(--muted); font-size: .92rem; }
  .season-body { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px 18px; margin-top: 6px; }
  .season .lbl2 { font-weight: 800; font-size: .88rem; margin-bottom: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chips span { background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: .84rem; font-weight: 700; }
  .season .tipbox { background: var(--green-l); border-radius: 12px; padding: 8px 12px; font-size: .9rem; font-weight: 600; }

  /* ---------- legend + summary ---------- */
  .strip { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 12px 16px; margin-bottom: 14px; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-weight: 700; font-size: .9rem; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
  .summary { display: flex; flex-wrap: wrap; gap: 8px; font-size: .88rem; }
  .pill { background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-weight: 700; }

  /* ---------- layout ---------- */
  .layout { display: grid; grid-template-columns: 1fr; gap: 18px; align-items: start; }
  .layout > * { min-width: 0; }
  @media (min-width: 1360px) {
    .layout { grid-template-columns: minmax(0, 1fr) 420px; }
    .panel { position: sticky; top: 14px; max-height: calc(100vh - 28px); overflow-y: auto; }
  }

  /* ---------- calendar ---------- */
  .cal { padding: 14px; }
  .cal-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .cal-title h2 { font-size: 1.6rem; color: var(--accent-d); }
  .heat-legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: .8rem; font-weight: 700; color: var(--muted); }
  .weekdays, .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .weekdays div { text-align: center; font-weight: 800; font-family: 'Baloo 2'; color: var(--muted); font-size: .95rem; padding: 4px 0; }
  .weekdays div.treatcol { color: var(--treat); }
  .day {
    min-width: 0; min-height: 124px; border-radius: 14px; padding: 6px 7px;
    background: var(--cell); border: 2px solid var(--line);
    cursor: pointer; display: flex; flex-direction: column; gap: 3px;
    transition: transform .15s, border-color .15s, box-shadow .15s;
    animation: fadeUp .4s ease both;
    text-align: left; font: inherit; color: inherit; position: relative;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .day:hover { transform: translateY(-2px); border-color: var(--accent); }
  .day.selected { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
  .day.today .num { background: var(--accent); color: #fff; }
  .day.treat { background: var(--treat-l); border-color: var(--treat-b); }
  .day.treat:hover, .day.treat.selected { border-color: var(--treat); }
  .day.h-good { background: var(--good-bg); }
  .day.h-mid  { background: var(--amber-l); }
  .day.h-low  { background: var(--red-l); }
  .day.cooked::after { content: '✓'; position: absolute; right: 7px; bottom: 4px; font-size: .85rem; font-weight: 800; color: var(--green); }
  .day.empty { background: transparent; border: none; cursor: default; animation: none; }
  .day-head { display: flex; justify-content: space-between; align-items: center; gap: 4px; }
  .day-head > span:first-child { display: inline-flex; align-items: center; }
  .num { font-family: 'Baloo 2'; font-weight: 800; font-size: 1rem; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .wdname { display: none; font-weight: 800; color: var(--muted); margin-left: 6px; }
  .tag { font-size: .66rem; font-weight: 800; padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
  .tag.h { background: var(--green-l); color: var(--green); }
  .tag.t { background: var(--chip); color: var(--treat); }
  .tag.v { background: var(--green-l); color: var(--vegan); }
  .tag.s { background: var(--amber-l); color: var(--amber); }
  .meal-line { font-size: .74rem; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meal-line.tf { color: var(--tiffin); font-weight: 700; }
  .meal-line .edited { color: var(--accent-d); }
  .kcal { margin-top: auto; font-size: .68rem; font-weight: 800; color: var(--muted); }
  .heat { font-size: .68rem; font-weight: 800; }

  /* ---------- month report ---------- */
  .report { padding: 16px; margin-top: 18px; }
  .report h2 { font-size: 1.4rem; color: var(--accent-d); margin-bottom: 4px; }
  .report .sub { color: var(--muted); font-weight: 700; font-size: .9rem; margin-bottom: 12px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .tile { border-radius: 16px; padding: 10px 12px; border: 2px solid var(--line); background: var(--cell); }
  .tile .t1 { font-weight: 800; font-size: .88rem; }
  .tile .t2 { font-family: 'Baloo 2'; font-weight: 800; font-size: 1.5rem; line-height: 1.1; }
  .tile .t3 { font-size: .75rem; color: var(--muted); font-weight: 700; }
  .tile.good { border-color: var(--green); background: var(--good-bg); } .tile.good .t2 { color: var(--green); }
  .tile.mid  { border-color: var(--amber); background: var(--amber-l); } .tile.mid .t2 { color: var(--amber); }
  .tile.low  { border-color: var(--red); background: var(--red-l); } .tile.low .t2 { color: var(--red); }
  .progress { height: 12px; background: var(--bg); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); margin-top: 6px; }
  .progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--green), var(--accent-2)); width: 0; transition: width .8s; }
  .tips { margin-top: 12px; display: grid; gap: 8px; }
  .tip { background: var(--bg); border-radius: 12px; padding: 8px 12px; font-size: .9rem; }

  /* ---------- day panel ---------- */
  .panel { padding: 18px; }
  .panel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .panel h2 { font-size: 1.45rem; line-height: 1.15; }
  .panel .sub { color: var(--muted); font-weight: 700; margin: 2px 0 12px; }
  .banner { border-radius: 14px; padding: 10px 12px; font-weight: 700; font-size: .9rem; margin-bottom: 12px; }
  .banner.h { background: var(--green-l); color: var(--green); }
  .banner.t { background: var(--treat-l); color: var(--treat); }
  .meals { display: grid; gap: 10px; }
  @media (min-width: 700px) and (max-width: 1359px) { .meals { grid-template-columns: 1fr 1fr; } }
  .meal { border: 2px solid var(--line); border-radius: 16px; padding: 12px; animation: fadeUp .35s ease both; }
  .meal.tiffin { border-color: var(--tiffin-b); background: var(--tiffin-l); }
  .meal.treat { border-color: var(--treat-b); background: var(--treat-l); }
  .meal-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
  .slot { font-family: 'Baloo 2'; font-weight: 800; font-size: .95rem; color: var(--muted); }
  .meal.tiffin .slot { color: var(--tiffin); }
  .meal.treat .slot { color: var(--treat); }
  .dish { display: flex; align-items: center; gap: 10px; }
  .dish .emo { font-size: 2rem; }
  .dish .name { font-family: 'Baloo 2'; font-weight: 700; font-size: 1.1rem; line-height: 1.2; }
  .badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
  .nutri { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .nutri span { font-size: .72rem; font-weight: 800; padding: 2px 7px; border-radius: 999px; background: var(--chip); border: 1px solid var(--line); }
  .meal-actions { display: flex; gap: 6px; margin-top: 8px; }
  .meal-actions select { flex: 1; min-width: 0; font-size: .88rem; padding: 5px 8px; }

  .section-title { font-family: 'Baloo 2'; font-weight: 800; font-size: 1.05rem; margin: 14px 0 6px; }
  .suggest { display: flex; flex-wrap: wrap; gap: 6px; }
  .sg {
    border: 2px dashed var(--green); background: var(--good-bg); border-radius: 12px; padding: 6px 10px;
    cursor: pointer; font: inherit; font-size: .85rem; font-weight: 700; text-align: left; color: var(--ink);
    transition: transform .15s;
  }
  .sg:hover { transform: translateY(-2px); border-style: solid; }
  .sg small { display: block; color: var(--green); font-weight: 800; }

  .totals { border-radius: 16px; background: var(--bg); padding: 12px; margin-top: 12px; }
  .bar-row { display: grid; grid-template-columns: 112px 1fr 96px; align-items: center; gap: 8px; font-size: .8rem; font-weight: 700; margin: 5px 0; }
  .bar { height: 10px; background: var(--chip); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
  .bar i { display: block; height: 100%; border-radius: 999px; width: 0; transition: width .8s cubic-bezier(.3,1.2,.5,1); }
  .bar i.good { background: var(--green); } .bar i.mid { background: var(--amber); } .bar i.low { background: var(--red); } .bar i.over { background: var(--treat); }
  .bar-row .val { text-align: right; }
  .note { font-size: .78rem; color: var(--muted); margin-top: 8px; }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translate(-50%, 120px);
    background: var(--ink); color: var(--bg); font-weight: 700; padding: 10px 18px; border-radius: 12px;
    transition: transform .3s; z-index: 20; max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { transform: translate(-50%, 0); }

  footer { text-align: center; color: var(--muted); font-size: .85rem; margin-top: 28px; }
  .madeby { font-family: 'Baloo 2'; font-size: 1.15rem; color: var(--accent-d); margin-bottom: 4px; }

  @media (max-width: 680px) {
    .weekdays { display: none; }
    .grid { grid-template-columns: 1fr; }
    .day.empty { display: none; }
    .day { min-height: 0; }
    .wdname { display: inline; }
    .meal-line { font-size: .84rem; white-space: normal; }
    .brand h1 { font-size: 1.6rem; }
    .bar-row { grid-template-columns: 92px 1fr 84px; }
    .season .big { font-size: 2.4rem; }
  }

  @media print {
    body { background: #fff; color: #000; }
    .controls, .options, .season, .panel, .report, .strip .summary, .toast { display: none !important; }
    .layout { grid-template-columns: 1fr; }
    .card { box-shadow: none; }
    .cal { padding: 0; }
    .day { min-height: 92px; break-inside: avoid; animation: none; background: #fff !important; }
    .meal-line { white-space: normal; font-size: .64rem; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">🍛</div>
      <div>
        <h1 id="appName">Khaana Planner</h1>
        <small id="tagline"></small>
      </div>
    </div>
    <div class="controls">
      <button class="btn" id="prev" aria-label="Previous month">◀</button>
      <select id="monthSel" aria-label="Month"></select>
      <select id="yearSel" aria-label="Year"></select>
      <button class="btn" id="next" aria-label="Next month">▶</button>
      <button class="btn" id="todayBtn"></button>
      <button class="btn primary" id="shuffle"></button>
      <button class="btn" id="reset"></button>
      <button class="btn" id="print"></button>
    </div>
  </header>

  <section class="card options" aria-label="Options">
    <div class="opt"><span class="lbl" data-t="language"></span>
      <div class="seg" id="langSeg"><button data-v="en">English</button><button data-v="hi">हिंदी</button></div></div>
    <div class="opt"><span class="lbl" data-t="diet"></span>
      <div class="seg" id="dietSeg"><button data-v="veg" data-t="veg"></button><button data-v="vegan" class="vg" data-t="vegan"></button></div></div>
    <div class="opt"><label for="themeSel" data-t="theme"></label><select id="themeSel"></select></div>
    <div class="opt"><label for="treatSel" data-t="treatDay"></label><select id="treatSel"></select></div>
    <div class="opt"><label for="schoolSel" data-t="schoolDays"></label><select id="schoolSel"></select></div>
    <div class="opt"><label for="colorSel" data-t="colorBy"></label><select id="colorSel"></select></div>
    <div class="opt"><span class="lbl" data-t="extras"></span><div class="checks" id="extras"></div></div>
  </section>

  <section class="card season" id="season" aria-label="Season"></section>

  <div class="card strip">
    <div class="legend" id="legend"></div>
    <div class="summary" id="summary"></div>
  </div>

  <div class="layout">
    <div>
      <section class="card cal">
        <div class="cal-title"><h2 id="calTitle"></h2><div class="heat-legend" id="heatLegend"></div></div>
        <div class="weekdays" id="weekdays"></div>
        <div class="grid" id="grid"></div>
      </section>
      <section class="card report" id="report" aria-label="Month nutrition report"></section>
    </div>
    <aside class="card panel" id="panel" aria-live="polite"></aside>
  </div>

  <footer>
    <p class="madeby" id="madeby"></p>
    <span id="disclaimer"></span>
  </footer>
</div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   Text in English and Hindi
   ========================================================= */
const T = {
  en: {
    appName: 'Khaana Planner',
    tagline: 'Indian veg & vegan meals for every day of the year · Made by <b>Nivriti Rajput</b> 👩‍🍳',
    madeby: 'Made with 💛 by <b>Nivriti Rajput</b>',
    disclaimer: 'Nutrient values are rough estimates per child-sized serving, and daily goals are an approximate guide for a 7–9 year old (based on ICMR-NIN 2020). Seasons and weather are for North India (Delhi region). This is not medical advice. Your plan and changes are saved in this browser only.',
    today: 'Today', newPlan: '🔀 New plan', reset: '↺ Reset edits', print: '🖨️ Print',
    language: 'Language', diet: 'Diet', veg: '🥛 Vegetarian', vegan: '🌱 Vegan', theme: 'Theme',
    treatDay: 'Treat day', noTreat: 'No treat day', schoolDays: 'School days', monFri: 'Mon – Fri', monSat: 'Mon – Sat',
    colorBy: 'Colour calendar by', nothing: 'Nothing', extras: 'Daily extras (added to every day)',

const mk = a => ({ en: a[0], hi: a[1], e: a[2], v: !!a[3], s: a[4], kcal: a[5], p: a[6], c: a[7], f: a[8], fb: a[9], fe: a[10], ca: a[11], vc: a[12], va: a[13], zn: a[14], b12: a[15] });

};

/* ---------- seeded random ---------- */
function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffled(n, r) {
  const a = [...Array(n).keys()];
  for (let i = n - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
/* Walks a list in shuffled order so no dish repeats until every dish has been used once */
function cycler(n, r) {
  let order = shuffled(n, r), i = 0, last = -1;
  return () => {
    if (i >= order.length) {
      order = shuffled(n, r); i = 0;
      if (order[0] === last && n > 1) [order[0], order[1]] = [order[1], order[0]];
    }
    return (last = order[i++]);
  };
}

/* Dishes allowed by the chosen diet */
const dietPool = list => D[list].filter(d => S.diet !== 'vegan' || d.v);
/* Dishes allowed by diet AND in season; falls back to the diet pool if too few are in season */
function seasonPool(list, season) {
  const all = dietPool(list);
  const fresh = all.filter(d => inSeason(d, season));
  const need = list.startsWith('treat') || list === 'sweet' ? 3 : 5;
  return fresh.length >= need ? fresh : all;
}

function slotsFor(wd) {
  const treat = wd === S.treat;
  const lunch = isSchool(wd) ? ['lunch', 'tiffin', 'tiffin']
              : treat ? ['lunch', 'lunch', 'treatLunch']
              : ['lunch', 'lunchHome', 'homeLunch'];
  const s = [
    ['breakfast', 'breakfast', treat ? 'treatBreakfast' : 'breakfast'],
    lunch,
    ['dinner', 'dinner', treat ? 'treatDinner' : 'dinner']
  ];
  if (treat) s.push(['sweet', 'sweet', 'sweet']);
  return s;
}

function activeExtras(season) {
  return Object.keys(EXTRAS).filter(k => S.extras[k]).map(k => {
    const x = EXTRAS[k];
    const d = mk((S.diet === 'vegan' && x.vegan) ? x.vegan : x.veg);
    if (k === 'fruit') { d.en = SEASONS[season].fruitName.en; d.hi = SEASONS[season].fruitName.hi; }
    return d;
  }).filter(d => S.diet !== 'vegan' || d.v);
}

/* Build a whole month (deterministic for month + options + seed), then apply the family's own picks */
function buildMonth(y, m) {
  const ym = `${y}-${pad(m + 1)}`;
  const season = seasonOf(m);
  const r = rng((y * 100 + m + 1) * 7919 + (seeds[ym] || 0) + (S.diet === 'vegan' ? 31337 : 0) + (S.treat + 1) * 101);
  const cyc = {}, pools = {};
  Object.keys(D).forEach(k => { pools[k] = seasonPool(k, season); cyc[k] = cycler(pools[k].length, r); });
  const days = new Date(y, m + 1, 0).getDate();
  const out = [];
  for (let d = 1; d <= days; d++) {
    const wd = new Date(y, m, d).getDay();
    const key = keyOf(y, m, d);
    const meals = slotsFor(wd).map(([slot, label, list]) => {
      const auto = pools[list][cyc[list]()];
      const want = edits[key] && edits[key][slot];
      const pick = want && dietPool(list).find(x => x.en === want);
      const dish = pick || auto;
      return { slot, label, list, dish, edited: !!pick && pick !== auto };
    });
    out.push({ d, wd, key, meals, treat: wd === S.treat });
  }
  return out;
}

function totals(p) {
  const t = {}; KEYS.forEach(k => t[k] = 0);
  [...p.meals.map(m => m.dish), ...activeExtras(seasonOf(M))].forEach(x => KEYS.forEach(k => t[k] += x[k]));
  return t;
}
const pct = (t, k) => t[k] / NUT[k].t;
const level = r => r >= 0.9 ? 'good' : r >= 0.6 ? 'mid' : 'low';

/* ---------- main render ---------- */
function render() {
  renderChrome();
  renderSeason();
  const lang = S.lang;
  $('calTitle').textContent = `${MONTHS[lang][M]} ${Y}`;
  plan = buildMonth(Y, M);
  if (sel > plan.length) sel = plan.length;

  const cb = S.colorBy;
  $('heatLegend').innerHTML = cb === 'none' ? '' :
    `<span>${NUT[cb].i} ${tr('heatLbl', { n: nl(cb) })}</span><span style="color:var(--green)">${tr('heatGood')}</span><span style="color:var(--amber)">${tr('heatMid')}</span><span style="color:var(--red)">${tr('heatLow')}</span>`;

  const first = new Date(Y, M, 1).getDay();
  const isNowMonth = Y === now.getFullYear() && M === now.getMonth();
  let html = '';
  for (let i = 0; i < first; i++) html += '<div class="day empty"></div>';
  plan.forEach((p, i) => {
    const t = totals(p);
    const heat = cb !== 'none' ? 'h-' + level(pct(t, cb)) : '';
    const lines = p.meals.filter(m => m.slot !== 'sweet').map(m =>
      `<div class="meal-line ${m.list === 'tiffin' ? 'tf' : ''}">${m.dish.e} ${m.edited ? '<span class="edited">✎</span> ' : ''}${nm(m.dish)}</div>`).join('');

      ${cb !== 'none' ? `<div class="heat">${NUT[cb].i} ${tr('ofGoal', { n: Math.round(pct(t, cb) * 100) })}</div>` : ''}

function renderSummary() {
  const healthy = plan.filter(p => !p.treat);
  const tiffins = plan.filter(p => isSchool(p.wd)).length;
  const done = plan.filter(p => cooked[p.key]).length;
  $('summary').innerHTML = `
    <span class="pill">${tr('sHealthy', { n: healthy.length })}</span>
    <span class="pill">${tr('sTreat', { n: plan.length - healthy.length })}</span>
    <span class="pill">${tr('sTiffin', { n: tiffins })}</span>
    <span class="pill">${tr('sCooked', { a: done, b: plan.length })}</span>`;
}

function renderReport() {
  const healthy = plan.filter(p => !p.treat);
  const base = healthy.length ? healthy : plan;
  const avg = {}; KEYS.forEach(k => avg[k] = base.reduce((s, p) => s + totals(p)[k], 0) / base.length);
  const done = plan.filter(p => cooked[p.key]).length;
  const weak = BOOST.filter(k => avg[k] / NUT[k].t < 0.9).sort((a, b) => avg[a] / NUT[a].t - avg[b] / NUT[b].t);
  $('report').innerHTML = `
    <h2>${tr('reportTitle', { m: MONTHS[S.lang][M] })}</h2>
    <div class="sub">${tr('reportSub', { n: base.length })}${S.diet === 'vegan' ? tr('subVegan') : ''}</div>
    <div class="tiles">${KEYS.map(k => {
      const r = avg[k] / NUT[k].t;
      return `<div class="tile ${level(r)}"><div class="t1">${NUT[k].i} ${nl(k)}</div>
        <div class="t2">${Math.round(r * 100)}%</div>
        <div class="t3">${tr('perDay', { v: fmt(avg[k], k), t: NUT[k].t, u: unit(k) })}</div></div>`;
    }).join('')}</div>
    <div class="section-title">${tr('progress', { a: done, b: plan.length })}</div>
    <div class="progress"><i style="width:${Math.round(done / plan.length * 100)}%"></i></div>

      ? weak.slice(0, 3).map(k => `<div class="tip"><b>${NUT[k].i} ${tr('lowOn', { n: nl(k) })}</b> ${FOOD_TIPS[S.lang][k]}</div>`).join('')

    </div>`;
}

function renderPanel() {

  const extras = activeExtras(season);
  const lang = S.lang;

  const meals = p.meals.map(m => {
    const x = m.dish;
    const all = dietPool(m.list);
    const opt = o => `<option value="${o.en}" ${o.en === x.en ? 'selected' : ''}>${o.e} ${nm(o)}${o.v && S.diet !== 'vegan' ? ' 🌱' : ''}</option>`;
    const fresh = all.filter(o => inSeason(o, season)), other = all.filter(o => !inSeason(o, season));
    const opts = `<optgroup label="${tr('inSeason')}">${fresh.map(opt).join('')}</optgroup>` +
                 (other.length ? `<optgroup label="${tr('otherDishes')}">${other.map(opt).join('')}</optgroup>` : '');
    const cls = m.list === 'tiffin' ? 'tiffin' : (p.treat ? 'treat' : '');
    return `<div class="meal ${cls}">
      <div class="meal-top"><span class="slot">${tr(m.label)}</span>${m.edited ? `<span class="tag h">${tr('yourPick')}</span>` : ''}</div>
      <div class="dish"><span class="emo">${x.e}</span>
        <div><div class="name">${nm(x)}</div>
          <div class="badges">${x.v ? `<span class="tag v">${tr('tVegan')}</span>` : `<span class="tag h">${tr('tVeg')}</span>`}
          ${x.s !== '*' && inSeason(x, season) ? `<span class="tag s">${tr('tSeason')}</span>` : ''}
          ${p.treat ? `<span class="tag t">${tr('tTreat')}</span>` : ''}</div></div></div>
      <div class="nutri">
        <span>🔥 ${x.kcal} ${unit('kcal')}</span><span>💪 ${x.p}g ${nl('p')}</span><span>🥦 ${x.fb}g ${nl('fb')}</span>
        <span>🩸 ${x.fe}mg ${nl('fe')}</span><span>🦴 ${x.ca}mg ${nl('ca')}</span><span>🍊 ${x.vc}mg ${nl('vc')}</span>
        <span>🥕 ${x.va}µg ${nl('va')}</span><span>⚡ ${x.zn}mg ${nl('zn')}</span>${x.b12 ? `<span>🧬 ${x.b12}µg B12</span>` : ''}
      </div>
      <div class="meal-actions">
        <select data-slot="${m.slot}" aria-label="${tr(m.label)}">${opts}</select>
        <button class="btn sm" data-swap="${m.slot}" data-list="${m.list}">${tr('swap')}</button>
      </div>
    </div>`;
  }).join('');

  /* Suggestions: in-season dishes that raise the weakest nutrient a swap can actually improve
     (e.g. vegan B12 can't be fixed by a dish, so we move on to the next weakest one) */
  const lowFirst = BOOST.slice().sort((a, b) => pct(t, a) - pct(t, b));
  const weakest = lowFirst[0];
  let sugg = [], boostKey = null;
  for (const k of lowFirst.filter(k => pct(t, k) < 0.9)) {
    const found = [];
    p.meals.filter(m => m.slot !== 'sweet').forEach(m => {
      seasonPool(m.list, season).filter(o => o.en !== m.dish.en && o[k] > m.dish[k])
        .forEach(o => found.push({ slot: m.slot, label: m.label, o, gain: o[k] - m.dish[k] }));
    });
    if (found.length) {
      found.sort((a, b) => b.gain - a.gain);
      const seen = new Set();
      sugg = found.filter(s => !seen.has(s.slot + s.o.en) && seen.add(s.slot + s.o.en)).slice(0, 4);
      boostKey = k;
      break;
    }
  }

  const bars = KEYS.map(k => {
    const r = pct(t, k);
    const over = (k === 'kcal' || k === 'f') && r > 1.15;
    return `<div class="bar-row"><span>${NUT[k].i} ${nl(k)}</span>
      <div class="bar"><i class="${over ? 'over' : level(r)}" data-w="${Math.min(100, Math.round(r * 100))}"></i></div>
      <span class="val">${fmt(t[k], k)}/${NUT[k].t} ${unit(k)}</span></div>`;
  }).join('');

  $('panel').innerHTML = `
    <div class="panel-head">
      <div><h2>${WD[lang][p.wd]}, ${p.d} ${MONTHS[lang][M]}</h2>
      <div class="sub">${tr(p.treat ? 'subTreat' : isSchool(p.wd) ? 'subSchool' : 'subHome')}${S.diet === 'vegan' ? tr('subVegan') : ''}</div></div>
      <button class="btn sm" id="cookBtn">${tr(cooked[p.key] ? 'cooked' : 'markCooked')}</button>
    </div>
    <div class="banner ${p.treat ? 't' : 'h'}">${p.treat ? tr('bannerTreat') : tr('bannerHealthy', { pr: tr(S.diet === 'vegan' ? 'prVegan' : 'prVeg') })}</div>
    <div class="meals">${meals}</div>

    ${sugg.length ? `<div class="section-title">${tr('boost', { n: NUT[boostKey].i + ' ' + nl(boostKey) })}</div>
      <div class="suggest">${sugg.map((s, i) => `<button class="sg" data-i="${i}">${s.o.e} ${nm(s.o)}<small>${tr(s.label).replace('🎒 ', '')}: +${fmt(s.gain, boostKey)} ${unit(boostKey)}</small></button>`).join('')}</div>` : ''}

    <div class="section-title">${tr('extrasIncl')}</div>
    <div class="suggest">${extras.length ? extras.map(x => `<span class="pill">${x.e} ${nm(x)}</span>`).join('') : `<span class="note">${tr('extrasNone')}</span>`}</div>

    <div class="totals">
      <div class="section-title" style="margin-top:0">${tr('dayTotal')}</div>
      ${bars}
      <div class="note">${pct(t, weakest) < 0.9 ? `<b>${tr('tip')}</b> ${FOOD_TIPS[lang][weakest]}` : tr('dayGreat')}</div>
    </div>`;

  requestAnimationFrame(() => $('panel').querySelectorAll('.bar i').forEach(i => i.style.width = i.dataset.w + '%'));

  const setDish = (slot, name) => {
    edits[p.key] = edits[p.key] || {};
    edits[p.key][slot] = name;
    store.set('kp2-edits', edits);
  };
  $('panel').querySelectorAll('select[data-slot]').forEach(s => s.onchange = () => { setDish(s.dataset.slot, s.value); toast(tr('saved')); render(); });
  $('panel').querySelectorAll('[data-swap]').forEach(b => b.onclick = () => {
    const cur = p.meals.find(m => m.slot === b.dataset.swap).dish.en;
    const choices = seasonPool(b.dataset.list, season).filter(o => o.en !== cur);
    if (!choices.length) return;
    const o = choices[Math.floor(Math.random() * choices.length)];
    setDish(b.dataset.swap, o.en); toast(tr('swapped', { d: o.e + ' ' + nm(o) })); render();
  });
  $('panel').querySelectorAll('.sg[data-i]').forEach(b => b.onclick = () => {
    const s = sugg[+b.dataset.i];
    setDish(s.slot, s.o.en); toast(tr('added', { d: s.o.e + ' ' + nm(s.o) })); render();
  });
  $('cookBtn').onclick = () => {
    if (cooked[p.key]) delete cooked[p.key]; else cooked[p.key] = true;
    store.set('kp2-cooked', cooked);
    toast(tr(cooked[p.key] ? 'cookedT' : 'unmarked'));
    render();
  };
}

let toastTimer;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

function go(dm) {
  M += dm;
  if (M < 0) { M = 11; Y--; } if (M > 11) { M = 0; Y++; }
  sel = 1; render();
}

/* ---------- controls ---------- */
setupOptions();
$('prev').onclick = () => go(-1);
$('next').onclick = () => go(1);
$('monthSel').onchange = e => { M = +e.target.value; sel = 1; render(); };
$('yearSel').onchange = e => { Y = +e.target.value; sel = 1; render(); };
$('todayBtn').onclick = () => { Y = now.getFullYear(); M = now.getMonth(); sel = now.getDate(); render(); };
$('shuffle').onclick = () => {
  const k = `${Y}-${pad(M + 1)}`;
  seeds[k] = Math.floor(Math.random() * 1e6);
  store.set('kp2-seeds', seeds);
  toast(tr('newPlanT', { m: MONTHS[S.lang][M] }));
  render();
};
$('reset').onclick = () => {
  const prefix = `${Y}-${pad(M + 1)}-`;
  Object.keys(edits).forEach(k => { if (k.startsWith(prefix)) delete edits[k]; });
  store.set('kp2-edits', edits);
  toast(tr('resetT'));
  render();
};
$('print').onclick = () => window.print();
document.addEventListener('keydown', e => {
  if (['SELECT', 'INPUT'].includes(e.target.tagName)) return;
  if (e.key === 'ArrowLeft') go(-1);
  if (e.key === 'ArrowRight') go(1);
});

render();
</script>
</body>
</html>
